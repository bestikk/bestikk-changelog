name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.1.0)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the version bundled with the
      # Node.js setup above may be older, so make sure it's current before publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set package version
        run: npm pkg set version=${{ inputs.version }}

      # Dogfooding: roll the "Unreleased" section into a dated "v<version>" section
      - name: Roll changelog
        run: node bin/cli.js release ${{ inputs.version }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        run: |
          git commit -am "chore: release ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"

      - name: Push
        run: git push && git push --tags

      # Dogfooding: extract the release section as Markdown release notes
      - name: Generate release notes
        run: node bin/cli.js notes ${{ inputs.version }} > /tmp/release-notes.md

      # Trusted publishing (OIDC): npm exchanges the workflow's id-token for a short-lived
      # publish token, so no NPM_TOKEN secret is needed.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --notes-file /tmp/release-notes.md
