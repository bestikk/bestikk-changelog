name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.1.0)
        required: true

permissions:
  contents: write
  id-token: write

# Never run two releases at once (they would race on the version bump, commit and tag)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Passed via the environment rather than interpolated with ${{ }} into the scripts below
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Releases are cut from main only: the release commit is pushed to the branch the
      # workflow runs on, and the tag must be reachable from main.
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be run from the main branch (got: $GITHUB_REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node.js 24 (>= 24.5.0) bundles npm >= 11.5.1, which trusted publishing (OIDC) requires;
      # no need to install another npm version on top of it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail early, before anything is committed, rather than at publish time
      - name: Check npm version
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`::error::npm >= 11.5.1 is required for trusted publishing (got: ${process.argv[1]})`)
              process.exit(1)
            }
          ' "$(npm --version)"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Unlike "npm pkg set version", "npm version" also updates package-lock.json, and
      # rejects an invalid version (or the current one) before anything else happens.
      - name: Set package version
        run: npm version "$VERSION" --no-git-tag-version

      # Dogfooding: roll the "Unreleased" section into a dated "v<version>" section
      - name: Roll changelog
        run: node bin/cli.js release "$VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Local only for now: nothing is pushed until the package is published, so a failed
      # publish leaves no commit/tag behind and the workflow can simply be re-run.
      - name: Commit and tag
        run: |
          git commit -am "chore: release $VERSION"
          git tag "v$VERSION"

      # Dogfooding: extract the release section as Markdown release notes
      - name: Generate release notes
        run: node bin/cli.js notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # Trusted publishing (OIDC): npm exchanges the workflow's id-token for a short-lived
      # publish token, so no NPM_TOKEN secret is needed.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Atomic: either both the release commit and the tag are pushed, or neither is
      - name: Push
        run: git push --atomic origin HEAD "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
